<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스톱워치 &amp; 타이머</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#1c1b19">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="스톱워치">
<style>
  :root {
    /* 2026 팬톤 올해의 컬러 팔레트: Cloud Dancer(11-4201) + Glamour & Gleam / Comfort Zone 보조 팔레트 */
    --bg: #1c1b19;
    --card: #26241f;
    --text: #f0eee9;
    --muted: #a9a29a;
    --accent: #4fb3ac;
    --green: #93ac7c;
    --red: #d9645c;
    --amber: #e0a25c;
    --border: #3a362f;
    --input-bg: #171614;
    --shadow: rgba(0,0,0,0.55);
    --tab-bg: #201e1a;
    --toggle-grad-1: #2e2b25;
    --toggle-grad-2: #14130f;
    --toggle-shadow-dark: rgba(0,0,0,0.6);
    --toggle-shadow-light: rgba(255,255,255,0.05);
    --icon-shadow: rgba(0,0,0,0.5);
    --card-grad-1: #2c2a24;
    --card-grad-2: #1a1815;
    --card-highlight: rgba(255,255,255,0.035);
    --green-edge: #5e7a4b;
    --red-edge: #a5372f;
    --accent-edge: #2a7570;
    --gray: #6e6a61;
    --gray-edge: #4a473f;
  }

  html[data-theme="light"] {
    --bg: #f0eee9;
    --card: #faf8f3;
    --text: #2b2a28;
    --muted: #8c877d;
    --accent: #2f6f6b;
    --green: #6f8b5e;
    --red: #b33a3a;
    --amber: #c98a3e;
    --border: #dcd7cc;
    --input-bg: #e8e4dc;
    --shadow: rgba(60,50,40,0.15);
    --tab-bg: #e7e2d8;
    --toggle-grad-1: #faf8f3;
    --toggle-grad-2: #e2ddd1;
    --toggle-shadow-dark: rgba(60,50,40,0.22);
    --toggle-shadow-light: rgba(255,255,255,0.9);
    --icon-shadow: rgba(60,50,40,0.3);
    --card-grad-1: #faf8f3;
    --card-grad-2: #e9e4d9;
    --card-highlight: rgba(255,255,255,0.85);
    --green-edge: #566b47;
    --red-edge: #8a2a2a;
    --accent-edge: #1f4e4b;
    --gray: #8c877d;
    --gray-edge: #6b665d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .card {
    background: linear-gradient(145deg, var(--card-grad-1), var(--card-grad-2));
    border-radius: 32px;
    padding: 32px 36px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow:
      14px 14px 28px var(--shadow),
      -10px -10px 24px var(--card-highlight),
      0 24px 60px var(--shadow);
    text-align: center;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    row-gap: 10px;
    margin-bottom: 26px;
  }

  .tabs {
    display: flex;
    background: var(--tab-bg);
    border-radius: 999px;
    padding: 4px;
    gap: 4px;
    box-shadow: inset 3px 3px 6px var(--toggle-shadow-dark), inset -3px -3px 6px var(--toggle-shadow-light);
  }

  .tab-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.02em;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
  }

  .tab-btn.active {
    background: var(--accent);
    color: white;
    box-shadow: 0 3px 0 var(--accent-edge), 0 4px 10px var(--shadow);
    transform: translateY(-1px);
  }

  .text-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
  }

  .text-toggle-btn {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    padding: 2px 0;
    transition: color 0.15s ease;
  }

  .text-toggle-btn.active {
    color: var(--accent);
  }

  .text-toggle .dot {
    color: var(--border);
    font-size: 12px;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .volume-slider {
    width: 44px;
    height: 16px;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    cursor: pointer;
  }

  .volume-slider::-webkit-slider-runnable-track {
    height: 2px;
    border-radius: 2px;
    background: var(--border);
  }

  .volume-slider::-moz-range-track {
    height: 2px;
    border-radius: 2px;
    background: var(--border);
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-top: -4px;
    border: none;
    background: var(--accent);
  }

  .volume-slider::-moz-range-thumb {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
  }

  .volume-slider:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .icon-toggle {
    width: 30px;
    height: 30px;
    padding: 0;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .icon-toggle:active {
    opacity: 0.6;
  }

  .icon-toggle.is-off {
    opacity: 0.45;
  }

  .icon-toggle .icon {
    font-size: 16px;
    line-height: 1;
  }

  .panel { display: none; }
  .panel.active { display: block; }

  .analog-clock {
    width: 188px;
    height: 188px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: var(--input-bg);
    box-shadow: inset 4px 4px 10px var(--toggle-shadow-dark), inset -4px -4px 10px var(--toggle-shadow-light);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: box-shadow 0.2s ease;
  }

  .analog-clock svg {
    width: 82%;
    height: 82%;
    overflow: visible;
  }

  .clock-ticks line {
    stroke: var(--muted);
    stroke-width: 1;
    stroke-linecap: round;
  }

  .clock-ticks line.major {
    stroke: var(--text);
    stroke-width: 2.2;
  }

  .hand-hour, .hand-minute {
    fill: var(--text);
    transform-origin: 50px 50px;
    transition: transform 0.05s linear;
  }

  .hand-second {
    stroke: var(--accent);
    stroke-width: 1.4;
    stroke-linecap: round;
    transform-origin: 50px 50px;
    transition: transform 0.05s linear;
  }

  .clock-center { fill: var(--accent); }

  #timerPanel.alert .analog-clock {
    box-shadow: inset 4px 4px 10px var(--toggle-shadow-dark), inset -4px -4px 10px var(--toggle-shadow-light), 0 0 0 3px var(--red);
  }

  #timerPanel.alert .hand-second { stroke: var(--red); }
  #timerPanel.alert .clock-center { fill: var(--red); }

  #timerPanel.alert .timer-input input,
  #timerPanel.alert .timer-input .time-circle {
    color: var(--red);
  }

  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 24px;
  }

  button {
    flex: 1;
    padding: 14px 0;
    border: none;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    color: white;
  }

  .btn-pop {
    box-shadow: 0 4px 0 var(--edge), 0 8px 16px var(--shadow);
    transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease, opacity 0.15s ease;
  }

  .btn-pop:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow: 0 0 0 var(--edge);
  }

  #startStopBtn { background: var(--green); --edge: var(--green-edge); }
  #startStopBtn.running { background: var(--red); --edge: var(--red-edge); }
  #lapBtn { background: var(--accent); --edge: var(--accent-edge); }
  #resetBtn { background: var(--gray); --edge: var(--gray-edge); }

  #timerStartStopBtn { background: var(--green); --edge: var(--green-edge); }
  #timerStartStopBtn.running { background: var(--red); --edge: var(--red-edge); }
  #timerResetBtn { background: var(--gray); --edge: var(--gray-edge); }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .laps {
    max-height: 240px;
    overflow-y: auto;
    overflow-x: hidden;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 4px 4px 4px 0;
  }

  .laps:empty { display: none; }

  .lap-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--tab-bg);
    border: none;
    border-radius: 999px;
    padding: 6px 18px 6px 6px;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    box-shadow: 3px 3px 6px var(--toggle-shadow-dark), -3px -3px 6px var(--toggle-shadow-light);
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }

  .lap-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex: none;
    background: var(--card);
    border: none;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    box-shadow: 2px 2px 4px var(--toggle-shadow-dark), -2px -2px 4px var(--toggle-shadow-light);
  }

  .lap-info {
    flex: 1;
    display: flex;
    justify-content: space-between;
    min-width: 0;
  }

  .lap-info .lap-total {
    color: var(--muted);
  }

  .lap-item.fastest .lap-badge { background: var(--green); color: white; }
  .lap-item.slowest .lap-badge { background: var(--red); color: white; }
  .lap-item.fastest .lap-time { color: var(--green); }
  .lap-item.slowest .lap-time { color: var(--red); }

  .laps::-webkit-scrollbar { width: 6px; }
  .laps::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .timer-input {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 28px;
  }

  .timer-input input,
  .timer-input .time-circle {
    width: 64px;
    height: 64px;
    padding: 0;
    text-align: center;
    font-size: 22px;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    border-radius: 50%;
    border: none;
    background: var(--input-bg);
    color: var(--text);
    box-shadow: inset 3px 3px 6px var(--toggle-shadow-dark), inset -3px -3px 6px var(--toggle-shadow-light);
    transition: box-shadow 0.15s ease;
  }

  .timer-input .time-circle {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .timer-input input:focus {
    outline: none;
    box-shadow: inset 2px 2px 5px var(--toggle-shadow-dark), inset -2px -2px 5px var(--toggle-shadow-light), 0 0 0 3px var(--accent);
  }

  .timer-input span {
    font-size: 22px;
    font-weight: 700;
    color: var(--muted);
  }

  .timer-input label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  .timer-presets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 24px;
  }

  .preset-btn {
    flex: none;
    background: var(--tab-bg);
    color: var(--muted);
    font-size: 13px;
    padding: 8px 16px;
    border: none;
    border-radius: 999px;
    box-shadow: 3px 3px 6px var(--toggle-shadow-dark), -3px -3px 6px var(--toggle-shadow-light);
    transition: box-shadow 0.1s ease, transform 0.1s ease;
  }

  .preset-btn:active {
    box-shadow: inset 2px 2px 4px var(--toggle-shadow-dark), inset -2px -2px 4px var(--toggle-shadow-light);
    transform: scale(0.96);
  }

  .hidden-el { display: none !important; }

  .pomodoro-status {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }

  .pomodoro-status .phase-label {
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .pomodoro-status.phase-focus .phase-label { color: var(--red); }
  .pomodoro-status.phase-break .phase-label { color: var(--green); }

  .pomodoro-dots {
    display: flex;
    gap: 6px;
  }

  .pomodoro-dots .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.2s ease;
  }

  .pomodoro-dots .dot.done { background: var(--green); }
  .pomodoro-dots .dot.current { background: var(--accent); }

  #timerSkipBtn { background: var(--accent); --edge: var(--accent-edge); }

  .rule-manage-btn {
    flex: none;
    width: 38px;
    height: 38px;
    padding: 0;
    border-radius: 50%;
    color: var(--accent);
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }

  #iconPickerOverlay { z-index: 1001; }

  .icon-picker-card { max-width: 280px; }

  .icon-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  .icon-grid button {
    border: none;
    background: var(--tab-bg);
    border-radius: 12px;
    font-size: 22px;
    padding: 10px 0;
    cursor: pointer;
    box-shadow: 2px 2px 4px var(--toggle-shadow-dark), -2px -2px 4px var(--toggle-shadow-light);
  }

  .icon-grid button.selected {
    box-shadow: 0 0 0 2px var(--accent);
  }

  .modal-card {
    background: linear-gradient(145deg, var(--card-grad-1), var(--card-grad-2));
    border-radius: 24px;
    padding: 22px;
    width: 100%;
    max-width: 340px;
    max-height: 82vh;
    overflow-y: auto;
    box-shadow: 0 24px 60px var(--shadow);
    text-align: left;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  .modal-header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .modal-close {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
  }

  .modal-add-btn {
    border: none;
    background: var(--accent);
    color: white;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .rule-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 220px;
    overflow-y: auto;
    margin-bottom: 18px;
  }

  .rule-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--tab-bg);
    border-radius: 14px;
    padding: 8px 10px;
    box-shadow: 3px 3px 6px var(--toggle-shadow-dark), -3px -3px 6px var(--toggle-shadow-light);
  }

  .rule-icon {
    font-size: 20px;
    flex: none;
  }

  .rule-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .rule-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
  }

  .rule-detail {
    font-size: 11px;
    color: var(--muted);
  }

  .rule-star, .rule-edit, .rule-delete {
    border: none;
    background: none;
    font-size: 15px;
    color: var(--muted);
    cursor: pointer;
    padding: 4px;
    flex: none;
  }

  .rule-star.active { color: var(--amber); }

  .rule-empty {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    margin: 10px 0;
  }

  .rule-form {
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }

  .rule-form-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .rule-icon-input,
  .rule-name-input,
  .rule-form-field input {
    border: none;
    border-radius: 10px;
    background: var(--input-bg);
    color: var(--text);
    padding: 9px 0;
    text-align: center;
    font-family: inherit;
  }

  .rule-icon-input:focus,
  .rule-name-input:focus,
  .rule-form-field input:focus {
    outline: none;
    box-shadow: 0 0 0 2px var(--accent);
  }

  .rule-icon-input {
    width: 44px;
    font-size: 18px;
    flex: none;
  }

  .rule-name-input {
    flex: 1;
    padding: 9px 10px;
    font-size: 13px;
    text-align: left;
  }

  .rule-form-field {
    flex: 1;
    text-align: center;
  }

  .rule-form-field input {
    width: 100%;
    font-size: 15px;
    font-weight: 700;
  }

  .rule-form-field label {
    display: block;
    font-size: 10px;
    color: var(--muted);
    margin-top: 3px;
  }

  .rule-save-btn {
    width: 100%;
    background: var(--accent);
    --edge: var(--accent-edge);
  }

  @media (max-width: 400px) {
    body { padding: 12px; }

    .card { padding: 26px 18px 30px; }

    .tab-btn {
      padding: 7px 10px;
      font-size: 12px;
    }

    .analog-clock {
      width: 160px;
      height: 160px;
    }

    .timer-input {
      gap: 6px;
    }

    .timer-input input,
    .timer-input .time-circle {
      width: 56px;
      height: 56px;
      font-size: 19px;
    }
  }

  @media (max-width: 350px) {
    .top-actions {
      margin-left: auto;
    }
  }
</style>
</head>
<body>

<div class="card">
  <div class="top-bar">
    <div class="tabs panel-tabs">
      <button class="tab-btn active" data-tab="stopwatchPanel">스톱워치</button>
      <button class="tab-btn" data-tab="timerPanel">타이머</button>
    </div>
    <div class="top-actions">
      <button id="themeToggle" class="icon-toggle" title="다크/라이트 모드 전환"><span class="icon">🌙</span></button>
      <button id="soundToggle" class="icon-toggle" title="완료음 켜기/끄기"><span class="icon">🔔</span></button>
      <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="70" title="볼륨">
    </div>
  </div>

  <div id="stopwatchPanel" class="panel active">
    <div class="timer-input">
      <div>
        <div class="time-circle" id="swHoursDisplay">00</div>
        <label>시</label>
      </div>
      <span>:</span>
      <div>
        <div class="time-circle" id="swMinutesDisplay">00</div>
        <label>분</label>
      </div>
      <span>:</span>
      <div>
        <div class="time-circle" id="swSecondsDisplay">00</div>
        <label>초</label>
      </div>
    </div>

    <div id="swAnalogView">
      <div class="analog-clock">
        <svg viewBox="0 0 100 100">
          <g class="clock-ticks" id="swTicks"></g>
          <rect id="swHourHand" class="hand-hour" x="48.5" y="26" width="3" height="24" rx="1.5"></rect>
          <rect id="swMinuteHand" class="hand-minute" x="49" y="14" width="2" height="36" rx="1"></rect>
          <line id="swSecondHand" class="hand-second" x1="50" y1="58" x2="50" y2="15"></line>
          <circle class="clock-center" cx="50" cy="50" r="3"></circle>
        </svg>
      </div>
    </div>

    <div class="controls">
      <button id="startStopBtn" class="btn-pop">시작</button>
      <button id="lapBtn" class="btn-pop" disabled>랩</button>
      <button id="resetBtn" class="btn-pop" disabled>초기화</button>
    </div>

    <div class="laps" id="laps"></div>
  </div>

  <div id="timerPanel" class="panel">
    <div class="text-toggle">
      <button class="text-toggle-btn timer-mode-btn active" data-timer-mode="normal">일반</button>

    <div class="pomodoro-status hidden-el" id="pomodoroStatus">
      <span class="phase-label" id="pomodoroPhaseLabel">집중 중</span>

    </div>

    <div class="timer-input" id="timerInputRow">
      <div>
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" id="hoursInput" value="00">
        <label>시</label>
      </div>
      <span>:</span>
      <div>
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" id="minutesInput" value="05">
        <label>분</label>
      </div>
      <span>:</span>
      <div>
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" id="secondsInput" value="00">
        <label>초</label>
      </div>
    </div>

    <div class="timer-input hidden-el" id="pomodoroInputRow">
      <div>
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" id="focusInput" value="25">
        <label id="focusLabel">집중(분)</label>
      </div>
      <span>:</span>
      <div>
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" id="breakInput" value="05">
        <label id="breakLabel">휴식(분)</label>
      </div>
      <span>:</span>
      <div>
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" id="setsInput" value="04">
        <label id="setsLabel">세트</label>

    <div id="timerAnalogView">
      <div class="analog-clock">
        <svg viewBox="0 0 100 100">
          <g class="clock-ticks" id="timerTicks"></g>
          <rect id="timerHourHand" class="hand-hour" x="48.5" y="26" width="3" height="24" rx="1.5"></rect>
          <rect id="timerMinuteHand" class="hand-minute" x="49" y="14" width="2" height="36" rx="1"></rect>
          <line id="timerSecondHand" class="hand-second" x1="50" y1="58" x2="50" y2="15"></line>
          <circle class="clock-center" cx="50" cy="50" r="3"></circle>
        </svg>

    <div class="timer-presets" id="normalPresets">
      <button class="preset-btn" data-secs="60">1분</button>
      <button class="preset-btn" data-secs="180">3분</button>
      <button class="preset-btn" data-secs="300">5분</button>
      <button class="preset-btn" data-secs="600">10분</button>
    </div>

    <div class="timer-presets hidden-el" id="pomodoroPresets"></div>

    <div class="controls">
      <button id="timerStartStopBtn" class="btn-pop">시작</button>
      <button id="timerSkipBtn" class="btn-pop hidden-el" disabled>건너뛰기</button>
      <button id="timerResetBtn" class="btn-pop" disabled>초기화</button>
    </div>
  </div>
</div>

  <div class="modal-card">
    <div class="modal-header">
      <span>포모도로 관리</span>
      <div class="modal-header-actions">
        <button class="modal-add-btn" id="ruleAddBtn" aria-label="포모도로 추가">+</button>
        <button class="modal-close" id="ruleModalClose" aria-label="닫기">×</button>

    <div class="rule-form hidden-el" id="ruleFormWrap">

<div class="modal-overlay hidden-el" id="iconPickerOverlay">
  <div class="modal-card icon-picker-card">
    <div class="modal-header">
      <span>아이콘 선택</span>
      <button class="modal-close" id="iconPickerClose" aria-label="닫기">×</button>
    </div>
    <div class="icon-grid" id="iconGrid"></div>
  </div>
</div>

<script>
  /* ---------- 테마 토글 ---------- */
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = themeToggle.querySelector('.icon');
  const root = document.documentElement;

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    themeIcon.textContent = theme === 'light' ? '☀️' : '🌙';
    try { localStorage.setItem('stopwatch-theme', theme); } catch (e) { /* 저장소 사용 불가 시 무시 */ }
  }

  let savedTheme = null;
  try { savedTheme = localStorage.getItem('stopwatch-theme'); } catch (e) { /* 저장소 사용 불가 시 무시 */ }

  applyTheme(savedTheme ||
    (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));

  themeToggle.addEventListener('click', () => {
    applyTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  });

  /* ---------- 소리 알림 켜기/끄기 + 볼륨 ---------- */
  const soundToggle = document.getElementById('soundToggle');
  const soundIcon = soundToggle.querySelector('.icon');
  const volumeSlider = document.getElementById('volumeSlider');

  let soundEnabled = true;
  try { soundEnabled = localStorage.getItem('stopwatch-sound') !== 'off'; } catch (e) { /* 저장소 사용 불가 시 무시 */ }

  let volumeLevel = 70;
  try {
    const storedVolume = localStorage.getItem('stopwatch-volume');
    if (storedVolume !== null) volumeLevel = Math.min(100, Math.max(0, parseInt(storedVolume, 10) || 0));
  } catch (e) { /* 저장소 사용 불가 시 무시 */ }
  volumeSlider.value = volumeLevel;

  function applySound(enabled) {
    soundEnabled = enabled;
    soundIcon.textContent = enabled ? '🔔' : '🔕';
    soundToggle.classList.toggle('is-off', !enabled);
    soundToggle.title = enabled ? '완료음 끄기' : '완료음 켜기';
    volumeSlider.disabled = !enabled;
    try { localStorage.setItem('stopwatch-sound', enabled ? 'on' : 'off'); } catch (e) { /* 저장소 사용 불가 시 무시 */ }
  }

  function applyVolume(level) {
    volumeLevel = level;
    try { localStorage.setItem('stopwatch-volume', String(level)); } catch (e) { /* 저장소 사용 불가 시 무시 */ }
  }

  applySound(soundEnabled);

  soundToggle.addEventListener('click', () => {
    applySound(!soundEnabled);
  });

  volumeSlider.addEventListener('input', () => {
    const level = parseInt(volumeSlider.value, 10);
    applyVolume(level);
    if (level === 0 && soundEnabled) applySound(false);
    else if (level > 0 && !soundEnabled) applySound(true);
  });

  /* ---------- 탭 전환 ---------- */
  const tabBtns = document.querySelectorAll('.panel-tabs .tab-btn');
  const panels = document.querySelectorAll('.panel');

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      panels.forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  /* ---------- 아날로그 시계 얼굴 (심플 모던 디자인) ---------- */
  const SVG_NS = 'http://www.w3.org/2000/svg';

  function buildTicks(ticksId) {
    const ticksG = document.getElementById(ticksId);
    if (!ticksG || ticksG.childElementCount) return;

    for (let i = 0; i < 12; i++) {
      const angle = i * 30 * Math.PI / 180;
      const isMajor = i % 3 === 0;
      const outerR = 44;
      const innerR = isMajor ? 37 : 40;
      const line = document.createElementNS(SVG_NS, 'line');
      line.setAttribute('x1', (50 + outerR * Math.sin(angle)).toFixed(2));
      line.setAttribute('y1', (50 - outerR * Math.cos(angle)).toFixed(2));
      line.setAttribute('x2', (50 + innerR * Math.sin(angle)).toFixed(2));
      line.setAttribute('y2', (50 - innerR * Math.cos(angle)).toFixed(2));
      if (isMajor) line.classList.add('major');
      ticksG.appendChild(line);
    }
  }

  buildTicks('swTicks');
  buildTicks('timerTicks');

  function updateWatchHands(hourEl, minuteEl, secondEl, totalMs) {
    const totalSeconds = Math.max(0, totalMs) / 1000;
    const secondDeg = (totalSeconds % 60) / 60 * 360;
    const minuteDeg = ((totalSeconds / 60) % 60) / 60 * 360;
    const hourDeg = ((totalSeconds / 3600) % 12) / 12 * 360;
    hourEl.style.transform = `rotate(${hourDeg}deg)`;
    minuteEl.style.transform = `rotate(${minuteDeg}deg)`;
    secondEl.style.transform = `rotate(${secondDeg}deg)`;
  }

  const swHourHand = document.getElementById('swHourHand');
  const swMinuteHand = document.getElementById('swMinuteHand');
  const swSecondHand = document.getElementById('swSecondHand');
  const timerHourHand = document.getElementById('timerHourHand');
  const timerMinuteHand = document.getElementById('timerMinuteHand');
  const timerSecondHand = document.getElementById('timerSecondHand');

  /* ---------- 공통 시간 포맷 ---------- */
  function formatTime(ms) {
    const totalMs = Math.max(0, Math.floor(ms));
    const hours = Math.floor(totalMs / 3600000);
    const minutes = Math.floor((totalMs % 3600000) / 60000);
    const seconds = Math.floor((totalMs % 60000) / 1000);
    const centis = Math.floor((totalMs % 1000) / 10);
    const pad = (n, len = 2) => String(n).padStart(len, '0');
    return {
      main: `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`,
      ms: `.${pad(centis)}`
    };
  }

  /* ---------- 스톱워치 ---------- */
  let swStart = 0;
  let swElapsed = 0;
  let swFrame = null;
  let swRunning = false;
  let swLastTickSecond = 0;
  let laps = [];

  const swHoursDisplay = document.getElementById('swHoursDisplay');
  const swMinutesDisplay = document.getElementById('swMinutesDisplay');
  const swSecondsDisplay = document.getElementById('swSecondsDisplay');
  const startStopBtn = document.getElementById('startStopBtn');
  const lapBtn = document.getElementById('lapBtn');
  const resetBtn = document.getElementById('resetBtn');
  const lapsEl = document.getElementById('laps');

  function swRender() {
    const now = swRunning ? swElapsed + (performance.now() - swStart) : swElapsed;
    const { main } = formatTime(now);
    const [h, m, s] = main.split(':');
    swHoursDisplay.textContent = h;
    swMinutesDisplay.textContent = m;
    swSecondsDisplay.textContent = s;
    updateWatchHands(swHourHand, swMinuteHand, swSecondHand, now);

    if (swRunning) {
      const currentSecond = Math.floor(now / 1000);
      if (currentSecond !== swLastTickSecond) {
        swLastTickSecond = currentSecond;
        playTick();
      }
    }
  }

  function swTick() {
    swRender();
    swFrame = requestAnimationFrame(swTick);
  }

  function swStartFn() {
    swRunning = true;
    swStart = performance.now();
    swLastTickSecond = Math.floor(swElapsed / 1000);
    swFrame = requestAnimationFrame(swTick);
    startStopBtn.textContent = '정지';
    startStopBtn.classList.add('running');
    lapBtn.disabled = false;
    resetBtn.disabled = false;
  }

  function swStop() {
    swRunning = false;
    swElapsed += performance.now() - swStart;
    cancelAnimationFrame(swFrame);
    swRender();
    startStopBtn.textContent = '시작';
    startStopBtn.classList.remove('running');
  }

  function swReset() {
    swRunning = false;
    cancelAnimationFrame(swFrame);
    swElapsed = 0;
    laps = [];
    swRender();
    renderLaps();
    startStopBtn.textContent = '시작';
    startStopBtn.classList.remove('running');
    lapBtn.disabled = true;
    resetBtn.disabled = true;
  }

  function addLap() {
    const current = swRunning ? swElapsed + (performance.now() - swStart) : swElapsed;
    const prev = laps.length ? laps[laps.length - 1].total : 0;
    laps.push({ total: current, split: current - prev });
    renderLaps();
  }

  function renderLaps() {
    lapsEl.innerHTML = '';
    if (laps.length === 0) return;

    const splits = laps.map(l => l.split);
    const fastest = Math.min(...splits);
    const slowest = Math.max(...splits);
    const hasVariance = laps.length > 1 && fastest !== slowest;

    laps.forEach((lap, i) => {
      const item = document.createElement('div');
      item.className = 'lap-item';
      if (hasVariance && lap.split === fastest) item.classList.add('fastest');
      if (hasVariance && lap.split === slowest) item.classList.add('slowest');

      const splitFmt = formatTime(lap.split);
      const totalFmt = formatTime(lap.total);

      item.innerHTML = `
        <span class="lap-badge">${i + 1}</span>
        <span class="lap-info">
          <span class="lap-time">${splitFmt.main}${splitFmt.ms}</span>
          <span class="lap-total">${totalFmt.main}${totalFmt.ms}</span>
        </span>
      `;
      lapsEl.insertBefore(item, lapsEl.firstChild);
    });
  }

  startStopBtn.addEventListener('click', () => {
    swRunning ? swStop() : swStartFn();
  });
  lapBtn.addEventListener('click', addLap);
  resetBtn.addEventListener('click', swReset);

  /* ---------- 타이머 ---------- */
  const hoursInput = document.getElementById('hoursInput');
  const minutesInput = document.getElementById('minutesInput');
  const secondsInput = document.getElementById('secondsInput');
  const timerInputRow = document.getElementById('timerInputRow');
  const timerStartStopBtn = document.getElementById('timerStartStopBtn');
  const timerResetBtn = document.getElementById('timerResetBtn');
  const timerSkipBtn = document.getElementById('timerSkipBtn');
  const presetBtns = document.querySelectorAll('#normalPresets .preset-btn');

  let timerDurationMs = 0;
  let timerRemainingMs = 0;
  let timerDeadline = 0;
  let timerFrame = null;
  let timerRunning = false;
  let timerFinished = false;
  let timerLastTickSecond = 0;

  /* ---------- 포모도로 서브 모드 ---------- */
  const timerModeBtns = document.querySelectorAll('.timer-mode-btn');
  const pomodoroInputRow = document.getElementById('pomodoroInputRow');
  const focusInput = document.getElementById('focusInput');
  const breakInput = document.getElementById('breakInput');
  const setsInput = document.getElementById('setsInput');
  const focusLabel = document.getElementById('focusLabel');
  const breakLabel = document.getElementById('breakLabel');
  const setsLabel = document.getElementById('setsLabel');
  const pomodoroStatusEl = document.getElementById('pomodoroStatus');
  const pomodoroPhaseLabel = document.getElementById('pomodoroPhaseLabel');
  const pomodoroDotsEl = document.getElementById('pomodoroDots');

  let timerMode = 'normal';
  let pomodoroPhase = 'focus';
  let pomodoroCurrentSet = 1;
  let pomodoroTotalSets = 4;
  let pomodoroFocusMs = 0;
  let pomodoroBreakMs = 0;

  function setPomodoroLabels(running) {
    focusLabel.textContent = running ? '분' : '집중(분)';
    breakLabel.textContent = running ? '초' : '휴식(분)';
    setsLabel.textContent = running ? '진행' : '세트';
  }

  function renderPomodoroDots(allDone) {
    pomodoroDotsEl.innerHTML = '';
    for (let i = 1; i <= pomodoroTotalSets; i++) {
      const dot = document.createElement('span');
      dot.className = 'dot';
      if (allDone || i < pomodoroCurrentSet) dot.classList.add('done');
      else if (i === pomodoroCurrentSet) dot.classList.add('current');
      pomodoroDotsEl.appendChild(dot);
    }
  }

  function updatePomodoroStatus() {
    pomodoroPhaseLabel.textContent = pomodoroPhase === 'focus' ? '집중 중' : '휴식 중';
    pomodoroStatusEl.classList.toggle('phase-focus', pomodoroPhase === 'focus');
    pomodoroStatusEl.classList.toggle('phase-break', pomodoroPhase === 'break');
    renderPomodoroDots();
  }

  function previewPomodoroStatus() {
    pomodoroTotalSets = Math.max(1, parseInt(setsInput.value, 10) || 1);
    pomodoroCurrentSet = 1;
    pomodoroPhase = 'focus';
    updatePomodoroStatus();
  }

  function switchTimerMode(mode) {
    if (mode === timerMode) return;
    const hasProgress = timerRunning || timerFinished || timerRemainingMs > 0;
    if (hasProgress) {
      const ok = window.confirm('모드를 전환하면 진행 중인 타이머가 초기화됩니다. 계속할까요?');
      if (!ok) return;
    }
    timerMode = mode;
    timerDurationMs = 0;
    pomodoroFocusMs = 0;
    pomodoroBreakMs = 0;
    timerModeBtns.forEach(b => b.classList.toggle('active', b.dataset.timerMode === mode));
    timerInputRow.classList.toggle('hidden-el', mode === 'pomodoro');
    pomodoroInputRow.classList.toggle('hidden-el', mode !== 'pomodoro');
    document.getElementById('normalPresets').classList.toggle('hidden-el', mode === 'pomodoro');
    document.getElementById('pomodoroPresets').classList.toggle('hidden-el', mode !== 'pomodoro');
    pomodoroStatusEl.classList.toggle('hidden-el', mode !== 'pomodoro');
    timerSkipBtn.classList.toggle('hidden-el', mode !== 'pomodoro');
    timerReset();
  }

  timerModeBtns.forEach(btn => {
    btn.addEventListener('click', () => switchTimerMode(btn.dataset.timerMode));
  });

  function advancePomodoroPhase() {
    if (pomodoroPhase === 'focus') {
      pomodoroPhase = 'break';
      timerDurationMs = pomodoroBreakMs;
    } else if (pomodoroCurrentSet < pomodoroTotalSets) {
      pomodoroCurrentSet += 1;
      pomodoroPhase = 'focus';
      timerDurationMs = pomodoroFocusMs;
    } else {
      timerFinished = true;
      pomodoroPhaseLabel.textContent = '포모도로 완료!';
      pomodoroStatusEl.classList.remove('phase-focus', 'phase-break');
      renderPomodoroDots(true);
      timerRender();
      document.getElementById('timerPanel').classList.add('alert');
      timerStartStopBtn.textContent = '시작';
      timerStartStopBtn.classList.remove('running');
      timerStartStopBtn.disabled = true;
      timerSkipBtn.disabled = true;
      return;
    }

    timerRemainingMs = timerDurationMs;
    updatePomodoroStatus();
    timerRunning = true;
    timerDeadline = performance.now() + timerRemainingMs;
    timerLastTickSecond = Math.floor(timerRemainingMs / 1000);
    timerFrame = requestAnimationFrame(timerTick);
    timerRender();
  }

  function timerSkip() {
    if (timerMode !== 'pomodoro' || timerFinished) return;
    if (!timerRunning && timerRemainingMs <= 0) return;
    cancelAnimationFrame(timerFrame);
    timerRunning = false;
    timerRemainingMs = 0;
    advancePomodoroPhase();
  }

  timerSkipBtn.addEventListener('click', timerSkip);

  /* ---------- 포모도로 규칙(즐겨찾기 프리셋) ---------- */
  const DEFAULT_POMODORO_RULES = [
    { id: 'r1', icon: '🎯', name: '25·5', focus: 25, break: 5, sets: 4, favorite: true },
    { id: 'r2', icon: '🚀', name: '50·10', focus: 50, break: 10, sets: 4, favorite: true },
    { id: 'r3', icon: '⚡', name: '15·3', focus: 15, break: 3, sets: 4, favorite: true },
    { id: 'r4', icon: '🌙', name: '45·15', focus: 45, break: 15, sets: 4, favorite: true }
  ];

  let pomodoroRules = DEFAULT_POMODORO_RULES.slice();
  try {
    const storedRules = localStorage.getItem('stopwatch-pomodoro-rules');
    if (storedRules) pomodoroRules = JSON.parse(storedRules);
  } catch (e) { /* 저장소 사용 불가 시 무시 */ }

  function saveRules() {
    try { localStorage.setItem('stopwatch-pomodoro-rules', JSON.stringify(pomodoroRules)); } catch (e) { /* 저장소 사용 불가 시 무시 */ }
  }

  const pomodoroPresetsEl = document.getElementById('pomodoroPresets');
  const ruleModalOverlay = document.getElementById('ruleModalOverlay');
  const ruleListEl = document.getElementById('ruleList');
  const ruleFormWrap = document.getElementById('ruleFormWrap');
  const ruleAddBtn = document.getElementById('ruleAddBtn');
  const ruleSaveBtn = document.getElementById('ruleSaveBtn');
  const ruleIconPickerBtn = document.getElementById('ruleIconPickerBtn');
  const ruleNameInput = document.getElementById('ruleNameInput');
  const ruleFocusInput = document.getElementById('ruleFocusInput');
  const ruleBreakInput = document.getElementById('ruleBreakInput');
  const ruleSetsInput = document.getElementById('ruleSetsInput');

  let editingRuleId = null;
  let currentRuleIcon = '🍅';

  function setRuleIcon(icon) {
    currentRuleIcon = icon;
    ruleIconPickerBtn.textContent = icon;
  }

  function updateRuleNamePlaceholder() {
    const f = parseInt(ruleFocusInput.value, 10) || 0;
    const b = parseInt(ruleBreakInput.value, 10) || 0;
    ruleNameInput.placeholder = `${f}-${b}`;
  }

  ruleFocusInput.addEventListener('input', updateRuleNamePlaceholder);
  ruleBreakInput.addEventListener('input', updateRuleNamePlaceholder);

  function resetRuleForm() {
    editingRuleId = null;
    setRuleIcon('🍅');
    ruleNameInput.value = '';
    ruleFocusInput.value = '25';
    ruleBreakInput.value = '05';
    ruleSetsInput.value = '04';
    ruleSaveBtn.textContent = '포모도로 추가';
    updateRuleNamePlaceholder();
  }

  function openRuleForm(rule) {
    if (rule) {
      editingRuleId = rule.id;
      setRuleIcon(rule.icon);
      ruleNameInput.value = rule.name;
      ruleFocusInput.value = String(rule.focus).padStart(2, '0');
      ruleBreakInput.value = String(rule.break).padStart(2, '0');
      ruleSetsInput.value = String(rule.sets).padStart(2, '0');
      ruleSaveBtn.textContent = '포모도로 수정';
      updateRuleNamePlaceholder();
    } else {
      resetRuleForm();
    }
    ruleFormWrap.classList.remove('hidden-el');
  }

  ruleAddBtn.addEventListener('click', () => {
    const isHidden = ruleFormWrap.classList.contains('hidden-el');
    if (isHidden || editingRuleId !== null) {
      openRuleForm(null);
    } else {
      ruleFormWrap.classList.add('hidden-el');
    }
  });

  /* ---------- 아이콘 선택 팝업 ---------- */
  const ICON_CHOICES = [
    '🍅', '🎯', '🚀', '⚡', '🌙', '☕', '📚', '💪', '🔥', '🧘',
    '⏰', '📝', '🎧', '🌊', '🍵', '✨', '💡', '🏃', '🎨', '🧠',
    '🏋️', '🚴', '🏊', '⚽', '🥊', '🚶', '📖', '✏️', '🎓', '💻'
  ];
  const iconPickerOverlay = document.getElementById('iconPickerOverlay');
  const iconGridEl = document.getElementById('iconGrid');

  function renderIconGrid() {
    iconGridEl.innerHTML = '';
    ICON_CHOICES.forEach(icon => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = icon;
      if (icon === currentRuleIcon) btn.classList.add('selected');
      btn.addEventListener('click', () => {
        setRuleIcon(icon);
        closeIconPicker();
      });
      iconGridEl.appendChild(btn);
    });
  }

  function openIconPicker() {
    renderIconGrid();
    iconPickerOverlay.classList.remove('hidden-el');
  }

  function closeIconPicker() {
    iconPickerOverlay.classList.add('hidden-el');
  }

  ruleIconPickerBtn.addEventListener('click', openIconPicker);
  document.getElementById('iconPickerClose').addEventListener('click', closeIconPicker);
  iconPickerOverlay.addEventListener('click', (e) => {
    if (e.target === iconPickerOverlay) closeIconPicker();
  });

  function applyRule(rule) {
    if (timerRunning) return;
    timerReset();
    const pad = (n) => String(n).padStart(2, '0');
    focusInput.value = pad(rule.focus);
    breakInput.value = pad(rule.break);
    setsInput.value = pad(rule.sets);
    previewPomodoroStatus();
  }

  function renderRuleChips() {
    pomodoroPresetsEl.innerHTML = '';
    pomodoroRules.filter(r => r.favorite).forEach(rule => {
      const btn = document.createElement('button');
      btn.className = 'preset-btn rule-chip';
      btn.textContent = `${rule.icon} ${rule.name}`;
      btn.addEventListener('click', () => applyRule(rule));
      pomodoroPresetsEl.appendChild(btn);
    });

    const manageBtn = document.createElement('button');
    manageBtn.className = 'preset-btn rule-manage-btn';
    manageBtn.textContent = '+';
    manageBtn.setAttribute('aria-label', '포모도로 관리');
    manageBtn.addEventListener('click', openRuleModal);
    pomodoroPresetsEl.appendChild(manageBtn);
  }

  function renderRuleList() {
    ruleListEl.innerHTML = '';
    if (pomodoroRules.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'rule-empty';
      empty.textContent = '저장된 규칙이 없습니다.';
      ruleListEl.appendChild(empty);
      return;
    }
    pomodoroRules.forEach(rule => {
      const item = document.createElement('div');
      item.className = 'rule-item';
      item.innerHTML = `
        <span class="rule-icon">${rule.icon}</span>
        <span class="rule-info">
          <span class="rule-name">${rule.name}</span>
          <span class="rule-detail">집중 ${rule.focus}분 · 휴식 ${rule.break}분 · ${rule.sets}세트</span>
        </span>
        <button class="rule-star${rule.favorite ? ' active' : ''}" title="즐겨찾기">★</button>
        <button class="rule-edit" title="수정">✎</button>
        <button class="rule-delete" title="삭제">🗑</button>
      `;
      item.querySelector('.rule-star').addEventListener('click', () => {
        rule.favorite = !rule.favorite;
        saveRules();
        renderRuleList();
        renderRuleChips();
      });
      item.querySelector('.rule-edit').addEventListener('click', () => {
        openRuleForm(rule);
      });
      item.querySelector('.rule-delete').addEventListener('click', () => {
        if (!window.confirm(`"${rule.name}" 규칙을 삭제할까요?`)) return;
        pomodoroRules = pomodoroRules.filter(r => r.id !== rule.id);
        if (editingRuleId === rule.id) {
          resetRuleForm();
          ruleFormWrap.classList.add('hidden-el');
        }
        saveRules();
        renderRuleList();
        renderRuleChips();
      });
      ruleListEl.appendChild(item);
    });
  }

  function openRuleModal() {
    resetRuleForm();
    ruleFormWrap.classList.add('hidden-el');
    renderRuleList();
    ruleModalOverlay.classList.remove('hidden-el');
  }

  function closeRuleModal() {
    ruleModalOverlay.classList.add('hidden-el');
  }

  document.getElementById('ruleModalClose').addEventListener('click', closeRuleModal);
  ruleModalOverlay.addEventListener('click', (e) => {
    if (e.target === ruleModalOverlay) closeRuleModal();
  });

  ruleSaveBtn.addEventListener('click', () => {
    const icon = currentRuleIcon;
    const focus = Math.max(0, parseInt(ruleFocusInput.value, 10) || 0);
    const brk = Math.max(0, parseInt(ruleBreakInput.value, 10) || 0);
    const sets = Math.max(1, parseInt(ruleSetsInput.value, 10) || 1);
    const name = ruleNameInput.value.trim() || `${focus}-${brk}`;

    if (focus <= 0) {
      ruleFocusInput.focus();
      return;
    }

    if (editingRuleId) {
      const rule = pomodoroRules.find(r => r.id === editingRuleId);
      if (rule) {
        rule.icon = icon;
        rule.name = name;
        rule.focus = focus;
        rule.break = brk;
        rule.sets = sets;
      }
    } else {
      pomodoroRules.push({
        id: 'r' + Date.now(),
        icon,
        name,
        focus,
        break: brk,
        sets,
        favorite: true
      });
    }

    saveRules();
    resetRuleForm();
    ruleFormWrap.classList.add('hidden-el');
    renderRuleList();
    renderRuleChips();
  });

  renderRuleChips();

  [focusInput, breakInput, setsInput].forEach(input => {
    input.addEventListener('input', () => {
      if (!timerRunning) timerReset();
    });
  });

  function getInputDurationMs() {
    const h = Math.max(0, parseInt(hoursInput.value, 10) || 0);
    const m = Math.max(0, parseInt(minutesInput.value, 10) || 0);
    const s = Math.max(0, parseInt(secondsInput.value, 10) || 0);
    return (h * 3600 + m * 60 + s) * 1000;
  }

  function timerRender() {
    if (timerRunning || timerFinished) {
      if (timerMode === 'pomodoro') {
        const totalSec = Math.max(0, Math.floor(timerRemainingMs / 1000));
        focusInput.value = String(Math.floor(totalSec / 60)).padStart(2, '0');
        breakInput.value = String(totalSec % 60).padStart(2, '0');
        setsInput.value = `${pomodoroCurrentSet}/${pomodoroTotalSets}`;
      } else {
        const { main } = formatTime(timerRemainingMs);
        const [h, m, s] = main.split(':');
        hoursInput.value = h;
        minutesInput.value = m;
        secondsInput.value = s;
      }
    }
    updateWatchHands(timerHourHand, timerMinuteHand, timerSecondHand, timerRemainingMs);

    if (timerRunning) {
      const currentSecond = Math.floor(timerRemainingMs / 1000);
      if (currentSecond !== timerLastTickSecond) {
        timerLastTickSecond = currentSecond;
        playTick();
      }
    }
  }

  function timerTick() {
    timerRemainingMs = Math.max(0, timerDeadline - performance.now());
    timerRender();
    if (timerRemainingMs <= 0) {
      timerComplete();
      return;
    }
    timerFrame = requestAnimationFrame(timerTick);
  }

  let audioCtx = null;
  function getAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playBeep() {
    if (!soundEnabled) return;
    try {
      const ctx = getAudioContext();
      const gainAmount = (volumeLevel / 100) * 0.3;
      [0, 0.35, 0.7].forEach(delay => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.value = gainAmount;
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + 0.25);
      });
    } catch (e) { /* 오디오 사용 불가 시 무시 */ }
  }

  function playTick() {
    if (!soundEnabled || volumeLevel <= 0) return;
    try {
      const ctx = getAudioContext();
      const gainAmount = (volumeLevel / 100) * 0.18;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 1200;
      gain.gain.setValueAtTime(gainAmount, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.05);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.06);
    } catch (e) { /* 오디오 사용 불가 시 무시 */ }
  }

  function timerComplete() {
    timerRunning = false;
    cancelAnimationFrame(timerFrame);
    timerRemainingMs = 0;
    playBeep();

    if (timerMode === 'pomodoro') {
      advancePomodoroPhase();
      return;
    }

    timerFinished = true;
    timerRender();
    document.getElementById('timerPanel').classList.add('alert');
    timerStartStopBtn.textContent = '시작';
    timerStartStopBtn.classList.remove('running');
    timerStartStopBtn.disabled = true;
  }

  function timerStart() {
    if (timerFinished) return;
    if (!timerRunning && timerRemainingMs <= 0) {
      if (timerMode === 'pomodoro') {
        pomodoroFocusMs = Math.max(0, parseInt(focusInput.value, 10) || 0) * 60000;
        pomodoroBreakMs = Math.max(0, parseInt(breakInput.value, 10) || 0) * 60000;
        pomodoroTotalSets = Math.max(1, parseInt(setsInput.value, 10) || 1);
        pomodoroCurrentSet = 1;
        pomodoroPhase = 'focus';
        timerDurationMs = pomodoroFocusMs;
        if (timerDurationMs <= 0) return;
        timerRemainingMs = timerDurationMs;
        setPomodoroLabels(true);
        updatePomodoroStatus();
      } else {
        timerDurationMs = getInputDurationMs();
        if (timerDurationMs <= 0) return;
        timerRemainingMs = timerDurationMs;
      }
    }
    timerRunning = true;
    timerDeadline = performance.now() + timerRemainingMs;
    timerLastTickSecond = Math.floor(timerRemainingMs / 1000);
    timerFrame = requestAnimationFrame(timerTick);
    timerStartStopBtn.textContent = '일시정지';
    timerStartStopBtn.classList.add('running');
    timerResetBtn.disabled = false;
    timerInputRow.style.pointerEvents = 'none';
    pomodoroInputRow.style.pointerEvents = 'none';
    if (timerMode === 'pomodoro') timerSkipBtn.disabled = false;
  }

  function timerPause() {
    timerRunning = false;
    timerRemainingMs = Math.max(0, timerDeadline - performance.now());
    cancelAnimationFrame(timerFrame);
    timerStartStopBtn.textContent = '재개';
    timerStartStopBtn.classList.remove('running');
  }

  function timerReset() {
    timerRunning = false;
    timerFinished = false;
    cancelAnimationFrame(timerFrame);
    timerRemainingMs = 0;

    if (timerMode === 'pomodoro') {
      if (pomodoroFocusMs > 0 || pomodoroBreakMs > 0) {
        focusInput.value = String(Math.round(pomodoroFocusMs / 60000)).padStart(2, '0');
        breakInput.value = String(Math.round(pomodoroBreakMs / 60000)).padStart(2, '0');
        setsInput.value = String(pomodoroTotalSets).padStart(2, '0');
      }
      pomodoroFocusMs = 0;
      pomodoroBreakMs = 0;
      setPomodoroLabels(false);
      previewPomodoroStatus();
    } else if (timerDurationMs > 0) {
      const { main } = formatTime(timerDurationMs);
      const [h, m, s] = main.split(':');
      hoursInput.value = h;
      minutesInput.value = m;
      secondsInput.value = s;
    }
    timerDurationMs = 0;
    document.getElementById('timerPanel').classList.remove('alert');
    timerRender();
    timerStartStopBtn.textContent = '시작';
    timerStartStopBtn.classList.remove('running');
    timerStartStopBtn.disabled = false;
    timerResetBtn.disabled = true;
    timerSkipBtn.disabled = true;
    timerInputRow.style.pointerEvents = 'auto';
    pomodoroInputRow.style.pointerEvents = 'auto';
  }

  timerStartStopBtn.addEventListener('click', () => {
    timerRunning ? timerPause() : timerStart();
  });
  timerResetBtn.addEventListener('click', timerReset);

  presetBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      if (timerRunning) return;
      timerReset();
      const secs = parseInt(btn.dataset.secs, 10);
      const pad = (n) => String(n).padStart(2, '0');
      hoursInput.value = pad(Math.floor(secs / 3600));
      minutesInput.value = pad(Math.floor((secs % 3600) / 60));
      secondsInput.value = pad(secs % 60);
    });
  });

  [hoursInput, minutesInput, secondsInput].forEach(input => {
    input.addEventListener('input', () => {
      if (!timerRunning) timerReset();
    });
  });

  /* ---------- 키보드 단축키 (활성 탭 기준) ---------- */
  document.addEventListener('keydown', (e) => {
    const tag = document.activeElement.tagName;
    if (tag === 'INPUT') return;

    const stopwatchActive = document.getElementById('stopwatchPanel').classList.contains('active');

    if (e.code === 'Space') {
      e.preventDefault();
      if (stopwatchActive) {
        startStopBtn.click();
      } else if (!timerStartStopBtn.disabled) {
        timerStartStopBtn.click();
      }
    } else if (e.code === 'KeyL' && stopwatchActive && !lapBtn.disabled) {
      addLap();
    } else if (e.code === 'KeyR') {
      if (stopwatchActive && !resetBtn.disabled) swReset();
      else if (!stopwatchActive && !timerResetBtn.disabled) timerReset();
    }
  });

  swRender();
  timerRender();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => { /* 서비스 워커 미지원 시 무시 */ });
    });
  }
</script>
