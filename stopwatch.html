<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스톱워치 &amp; 타이머</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --green: #22c55e;
    --red: #ef4444;
    --amber: #f59e0b;
    --border: #334155;
    --input-bg: #0f172a;
    --shadow: rgba(0,0,0,0.4);
    --tab-bg: #0f172a;
    --toggle-grad-1: #263449;
    --toggle-grad-2: #0a0f1a;
    --toggle-shadow-dark: rgba(0,0,0,0.65);
    --toggle-shadow-light: rgba(255,255,255,0.06);
    --icon-shadow: rgba(0,0,0,0.5);
    --card-grad-1: #24334a;
    --card-grad-2: #161f30;
    --card-highlight: rgba(255,255,255,0.04);
    --green-edge: #15803d;
    --red-edge: #b91c1c;
    --accent-edge: #0369a1;
    --gray: #475569;
    --gray-edge: #2c384c;
    --dial-bg: #0c1424;
    --dial-ink: #e7ecf3;
    --hand-color: #6fa8ff;
    --case-color: #33415a;
  }

  html[data-theme="light"] {
    --bg: #eef2f7;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #0284c7;
    --green: #16a34a;
    --red: #dc2626;
    --amber: #d97706;
    --border: #e2e8f0;
    --input-bg: #f1f5f9;
    --shadow: rgba(15,23,42,0.12);
    --tab-bg: #f1f5f9;
    --toggle-grad-1: #ffffff;
    --toggle-grad-2: #dde3ec;
    --toggle-shadow-dark: rgba(15,23,42,0.2);
    --toggle-shadow-light: rgba(255,255,255,0.95);
    --icon-shadow: rgba(15,23,42,0.25);
    --card-grad-1: #ffffff;
    --card-grad-2: #e8edf4;
    --card-highlight: rgba(255,255,255,0.9);
    --green-edge: #166534;
    --red-edge: #991b1b;
    --accent-edge: #075985;
    --gray: #64748b;
    --gray-edge: #47566b;
    --dial-bg: #fbf6ea;
    --dial-ink: #1f2937;
    --hand-color: #1e3a8a;
    --case-color: #cbd2db;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .card {
    background: linear-gradient(145deg, var(--card-grad-1), var(--card-grad-2));
    border-radius: 32px;
    padding: 32px 36px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow:
      14px 14px 28px var(--shadow),
      -10px -10px 24px var(--card-highlight),
      0 24px 60px var(--shadow);
    text-align: center;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .tabs {
    display: flex;
    background: var(--tab-bg);
    border-radius: 999px;
    padding: 4px;
    gap: 4px;
    box-shadow: inset 3px 3px 6px var(--toggle-shadow-dark), inset -3px -3px 6px var(--toggle-shadow-light);
  }

  .tab-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.02em;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
  }

  .tab-btn.active {
    background: var(--accent);
    color: white;
    box-shadow: 0 3px 0 var(--accent-edge), 0 4px 10px var(--shadow);
    transform: translateY(-1px);
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .icon-toggle {
    width: 40px;
    height: 40px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--toggle-grad-1), var(--toggle-grad-2));
    box-shadow: 4px 4px 8px var(--toggle-shadow-dark), -4px -4px 8px var(--toggle-shadow-light);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    transition: box-shadow 0.15s ease, transform 0.08s ease, background 0.2s ease;
  }

  .icon-toggle:active {
    transform: scale(0.92);
    box-shadow: inset 3px 3px 6px var(--toggle-shadow-dark), inset -3px -3px 6px var(--toggle-shadow-light);
  }

  .icon-toggle.is-off {
    box-shadow: inset 3px 3px 6px var(--toggle-shadow-dark), inset -3px -3px 6px var(--toggle-shadow-light);
  }

  .icon-toggle .icon {
    font-size: 17px;
    line-height: 1;
    filter: drop-shadow(0 2px 2px var(--icon-shadow));
    transform: translateY(-1px);
    transition: opacity 0.15s ease;
  }

  .icon-toggle.is-off .icon {
    opacity: 0.5;
  }

  .panel { display: none; }
  .panel.active { display: block; }

  .mode-switch-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }

  .mode-btn {
    font-size: 12px;
    padding: 6px 14px;
  }

  .view { display: none; }
  .view.active { display: block; }

  .analog-clock {
    width: 188px;
    height: 188px;
    margin: 0 auto 28px;
    border-radius: 26px;
    background: var(--input-bg);
    box-shadow: inset 4px 4px 10px var(--toggle-shadow-dark), inset -4px -4px 10px var(--toggle-shadow-light);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: box-shadow 0.2s ease;
  }

  .analog-clock svg {
    width: 88%;
    height: 88%;
    overflow: visible;
  }

  .clock-case { fill: var(--case-color); }
  .clock-face { fill: var(--dial-bg); }

  .clock-track {
    fill: none;
    stroke: var(--dial-ink);
    stroke-width: 0.4;
    opacity: 0.35;
  }

  .clock-ticks line {
    stroke: var(--dial-ink);
    stroke-width: 0.6;
    opacity: 0.7;
  }

  .clock-ticks line.major {
    stroke-width: 1.3;
    opacity: 0.9;
  }

  .clock-numerals text {
    fill: var(--dial-ink);
    font-family: 'Times New Roman', Georgia, serif;
    font-size: 7.5px;
    font-weight: 600;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .hand-hour, .hand-minute {
    fill: var(--hand-color);
    transform-origin: 50px 50px;
    transition: transform 0.05s linear;
  }

  .hand-second-group {
    transform-origin: 50px 50px;
    transition: transform 0.05s linear;
  }

  .hand-second-group line {
    stroke: var(--red);
    stroke-width: 0.8;
    stroke-linecap: round;
  }

  .hand-second-group circle {
    fill: var(--red);
  }

  .clock-pin { fill: var(--hand-color); }

  #timerPanel.alert .analog-clock {
    box-shadow: inset 4px 4px 10px var(--toggle-shadow-dark), inset -4px -4px 10px var(--toggle-shadow-light), 0 0 0 3px var(--red);
  }

  .display {
    font-variant-numeric: tabular-nums;
    font-size: 56px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 32px;
    line-height: 1;
    transition: color 0.2s ease;
  }

  .display .ms {
    font-size: 28px;
    color: var(--muted);
  }

  .display.alert { color: var(--red); }

  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 24px;
  }

  button {
    flex: 1;
    padding: 14px 0;
    border: none;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    color: white;
  }

  .btn-pop {
    box-shadow: 0 4px 0 var(--edge), 0 8px 16px var(--shadow);
    transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease, opacity 0.15s ease;
  }

  .btn-pop:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow: 0 0 0 var(--edge);
  }

  #startStopBtn { background: var(--green); --edge: var(--green-edge); }
  #startStopBtn.running { background: var(--red); --edge: var(--red-edge); }
  #lapBtn { background: var(--accent); --edge: var(--accent-edge); }
  #resetBtn { background: var(--gray); --edge: var(--gray-edge); }

  #timerStartStopBtn { background: var(--green); --edge: var(--green-edge); }
  #timerStartStopBtn.running { background: var(--red); --edge: var(--red-edge); }
  #timerResetBtn { background: var(--gray); --edge: var(--gray-edge); }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .laps {
    max-height: 240px;
    overflow-y: auto;
    overflow-x: hidden;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 4px 4px 4px 0;
  }

  .laps:empty { display: none; }

  .lap-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--tab-bg);
    border: none;
    border-radius: 999px;
    padding: 6px 18px 6px 6px;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    box-shadow: 3px 3px 6px var(--toggle-shadow-dark), -3px -3px 6px var(--toggle-shadow-light);
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }

  .lap-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex: none;
    background: var(--card);
    border: none;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    box-shadow: 2px 2px 4px var(--toggle-shadow-dark), -2px -2px 4px var(--toggle-shadow-light);
  }

  .lap-info {
    flex: 1;
    display: flex;
    justify-content: space-between;
    min-width: 0;
  }

  .lap-info .lap-total {
    color: var(--muted);
  }

  .lap-item.fastest .lap-badge { background: var(--green); color: white; }
  .lap-item.slowest .lap-badge { background: var(--red); color: white; }
  .lap-item.fastest .lap-time { color: var(--green); }
  .lap-item.slowest .lap-time { color: var(--red); }

  .laps::-webkit-scrollbar { width: 6px; }
  .laps::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .timer-input {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 28px;
  }

  .timer-input input {
    width: 64px;
    height: 64px;
    padding: 0;
    text-align: center;
    font-size: 22px;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    border-radius: 50%;
    border: none;
    background: var(--input-bg);
    color: var(--text);
    box-shadow: inset 3px 3px 6px var(--toggle-shadow-dark), inset -3px -3px 6px var(--toggle-shadow-light);
    transition: box-shadow 0.15s ease;
  }

  .timer-input input:focus {
    outline: none;
    box-shadow: inset 2px 2px 5px var(--toggle-shadow-dark), inset -2px -2px 5px var(--toggle-shadow-light), 0 0 0 3px var(--accent);
  }

  .timer-input input::-webkit-inner-spin-button,
  .timer-input input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .timer-input span {
    font-size: 22px;
    font-weight: 700;
    color: var(--muted);
  }

  .timer-input label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  .timer-presets {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 24px;
  }

  .preset-btn {
    flex: none;
    background: var(--tab-bg);
    color: var(--muted);
    font-size: 13px;
    padding: 8px 16px;
    border: none;
    border-radius: 999px;
    box-shadow: 3px 3px 6px var(--toggle-shadow-dark), -3px -3px 6px var(--toggle-shadow-light);
    transition: box-shadow 0.1s ease, transform 0.1s ease;
  }

  .preset-btn:active {
    box-shadow: inset 2px 2px 4px var(--toggle-shadow-dark), inset -2px -2px 4px var(--toggle-shadow-light);
    transform: scale(0.96);
  }

  #timerPanel .display {
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="top-bar">
    <div class="tabs">
      <button class="tab-btn active" data-tab="stopwatchPanel">스톱워치</button>
      <button class="tab-btn" data-tab="timerPanel">타이머</button>
    </div>
    <div class="top-actions">
      <button id="soundToggle" class="icon-toggle" title="완료음 켜기/끄기"><span class="icon">🔔</span></button>
      <button id="themeToggle" class="icon-toggle" title="다크/라이트 모드 전환"><span class="icon">🌙</span></button>
    </div>
  </div>

  <div id="stopwatchPanel" class="panel active">
    <div class="mode-switch-wrap">
      <div class="tabs mode-switch">
        <button class="tab-btn mode-btn active" data-mode="digital">디지털</button>
        <button class="tab-btn mode-btn" data-mode="analog">아날로그</button>
      </div>
    </div>

    <div id="swDigitalView" class="view active">
      <div class="display">
        <span id="time">00:00:00</span><span class="ms" id="ms">.00</span>
      </div>
    </div>

    <div id="swAnalogView" class="view">
      <div class="analog-clock">
        <svg viewBox="0 0 100 100">
          <rect class="clock-case" x="3" y="3" width="94" height="94" rx="18"></rect>
          <rect class="clock-face" x="9" y="9" width="82" height="82" rx="14"></rect>
          <circle class="clock-track" cx="50" cy="50" r="39"></circle>
          <g class="clock-ticks" id="swTicks"></g>
          <g class="clock-numerals" id="swNumerals"></g>
          <polygon id="swHourHand" class="hand-hour" points="48.6,52 51.4,52 50.9,33 50,29 49.1,33"></polygon>
          <polygon id="swMinuteHand" class="hand-minute" points="48.9,54 51.1,54 50.6,22 50,17 49.4,22"></polygon>
          <g id="swSecondGroup" class="hand-second-group">
            <line x1="50" y1="66" x2="50" y2="16"></line>
            <circle cx="50" cy="60" r="2.5"></circle>
          </g>
          <circle class="clock-pin" cx="50" cy="50" r="2.2"></circle>
        </svg>
      </div>
    </div>

    <div class="controls">
      <button id="startStopBtn" class="btn-pop">시작</button>
      <button id="lapBtn" class="btn-pop" disabled>랩</button>
      <button id="resetBtn" class="btn-pop" disabled>초기화</button>
    </div>

    <div class="laps" id="laps"></div>
  </div>

  <div id="timerPanel" class="panel">
    <div class="timer-input" id="timerInputRow">
      <div>
        <input type="number" id="hoursInput" min="0" max="99" value="0">
        <label>시</label>
      </div>
      <span>:</span>
      <div>
        <input type="number" id="minutesInput" min="0" max="59" value="5">
        <label>분</label>
      </div>
      <span>:</span>
      <div>
        <input type="number" id="secondsInput" min="0" max="59" value="0">
        <label>초</label>
      </div>
    </div>

    <div class="mode-switch-wrap">
      <div class="tabs mode-switch">
        <button class="tab-btn mode-btn active" data-mode="digital">디지털</button>
        <button class="tab-btn mode-btn" data-mode="analog">아날로그</button>
      </div>
    </div>

    <div id="timerDigitalView" class="view active">
      <div class="display" id="timerDisplayWrap">
        <span id="timerTime">00:00:00</span>
      </div>
    </div>

    <div id="timerAnalogView" class="view">
      <div class="analog-clock">
        <svg viewBox="0 0 100 100">
          <rect class="clock-case" x="3" y="3" width="94" height="94" rx="18"></rect>
          <rect class="clock-face" x="9" y="9" width="82" height="82" rx="14"></rect>
          <circle class="clock-track" cx="50" cy="50" r="39"></circle>
          <g class="clock-ticks" id="timerTicks"></g>
          <g class="clock-numerals" id="timerNumerals"></g>
          <polygon id="timerHourHand" class="hand-hour" points="48.6,52 51.4,52 50.9,33 50,29 49.1,33"></polygon>
          <polygon id="timerMinuteHand" class="hand-minute" points="48.9,54 51.1,54 50.6,22 50,17 49.4,22"></polygon>
          <g id="timerSecondGroup" class="hand-second-group">
            <line x1="50" y1="66" x2="50" y2="16"></line>
            <circle cx="50" cy="60" r="2.5"></circle>
          </g>
          <circle class="clock-pin" cx="50" cy="50" r="2.2"></circle>
        </svg>
      </div>
    </div>

    <div class="timer-presets">
      <button class="preset-btn" data-secs="60">1분</button>
      <button class="preset-btn" data-secs="180">3분</button>
      <button class="preset-btn" data-secs="300">5분</button>
      <button class="preset-btn" data-secs="600">10분</button>
    </div>

    <div class="controls">
      <button id="timerStartStopBtn" class="btn-pop">시작</button>
      <button id="timerResetBtn" class="btn-pop" disabled>초기화</button>
    </div>
  </div>
</div>

<script>
  /* ---------- 테마 토글 ---------- */
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = themeToggle.querySelector('.icon');
  const root = document.documentElement;

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    themeIcon.textContent = theme === 'light' ? '☀️' : '🌙';
    try { localStorage.setItem('stopwatch-theme', theme); } catch (e) { /* 저장소 사용 불가 시 무시 */ }
  }

  let savedTheme = null;
  try { savedTheme = localStorage.getItem('stopwatch-theme'); } catch (e) { /* 저장소 사용 불가 시 무시 */ }

  applyTheme(savedTheme ||
    (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));

  themeToggle.addEventListener('click', () => {
    applyTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  });

  /* ---------- 소리 알림 토글 ---------- */
  const soundToggle = document.getElementById('soundToggle');
  const soundIcon = soundToggle.querySelector('.icon');

  let soundEnabled = true;
  try { soundEnabled = localStorage.getItem('stopwatch-sound') !== 'off'; } catch (e) { /* 저장소 사용 불가 시 무시 */ }

  function applySound(enabled) {
    soundEnabled = enabled;
    soundIcon.textContent = enabled ? '🔔' : '🔕';
    soundToggle.classList.toggle('is-off', !enabled);
    soundToggle.title = enabled ? '완료음 끄기' : '완료음 켜기';
    try { localStorage.setItem('stopwatch-sound', enabled ? 'on' : 'off'); } catch (e) { /* 저장소 사용 불가 시 무시 */ }
  }

  applySound(soundEnabled);

  soundToggle.addEventListener('click', () => {
    applySound(!soundEnabled);
  });

  /* ---------- 탭 전환 ---------- */
  const tabBtns = document.querySelectorAll('.top-bar .tab-btn');
  const panels = document.querySelectorAll('.panel');

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      panels.forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  /* ---------- 디지털/아날로그 표시 모드 ---------- */
  const modeBtns = document.querySelectorAll('.mode-btn');

  let displayMode = 'digital';
  try { displayMode = localStorage.getItem('stopwatch-display-mode') || 'digital'; } catch (e) { /* 저장소 사용 불가 시 무시 */ }

  function applyDisplayMode(mode) {
    displayMode = mode;
    modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    document.getElementById('swDigitalView').classList.toggle('active', mode === 'digital');
    document.getElementById('swAnalogView').classList.toggle('active', mode === 'analog');
    document.getElementById('timerDigitalView').classList.toggle('active', mode === 'digital');
    document.getElementById('timerAnalogView').classList.toggle('active', mode === 'analog');
    try { localStorage.setItem('stopwatch-display-mode', mode); } catch (e) { /* 저장소 사용 불가 시 무시 */ }
  }

  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => applyDisplayMode(btn.dataset.mode));
  });

  applyDisplayMode(displayMode);

  /* ---------- 아날로그 시계 얼굴(로마 숫자 + 레일웨이 트랙) ---------- */
  const ROMAN_NUMERALS = ['XII', 'I', 'II', 'III', 'IIII', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];
  const SVG_NS = 'http://www.w3.org/2000/svg';

  function buildWatchFace(ticksId, numeralsId) {
    const ticksG = document.getElementById(ticksId);
    const numeralsG = document.getElementById(numeralsId);
    if (!ticksG || ticksG.childElementCount) return;

    for (let i = 0; i < 60; i++) {
      const angle = i * 6 * Math.PI / 180;
      const isMajor = i % 5 === 0;
      const outerR = 39;
      const innerR = isMajor ? 34 : 36.5;
      const line = document.createElementNS(SVG_NS, 'line');
      line.setAttribute('x1', (50 + outerR * Math.sin(angle)).toFixed(2));
      line.setAttribute('y1', (50 - outerR * Math.cos(angle)).toFixed(2));
      line.setAttribute('x2', (50 + innerR * Math.sin(angle)).toFixed(2));
      line.setAttribute('y2', (50 - innerR * Math.cos(angle)).toFixed(2));
      if (isMajor) line.classList.add('major');
      ticksG.appendChild(line);
    }

    ROMAN_NUMERALS.forEach((num, i) => {
      const angle = i * 30 * Math.PI / 180;
      const r = 26;
      const text = document.createElementNS(SVG_NS, 'text');
      text.setAttribute('x', (50 + r * Math.sin(angle)).toFixed(2));
      text.setAttribute('y', (50 - r * Math.cos(angle)).toFixed(2));
      text.textContent = num;
      numeralsG.appendChild(text);
    });
  }

  buildWatchFace('swTicks', 'swNumerals');
  buildWatchFace('timerTicks', 'timerNumerals');

  function updateWatchHands(hourEl, minuteEl, secondGroupEl, totalMs) {
    const totalSeconds = Math.max(0, totalMs) / 1000;
    const secondDeg = (totalSeconds % 60) / 60 * 360;
    const minuteDeg = ((totalSeconds / 60) % 60) / 60 * 360;
    const hourDeg = ((totalSeconds / 3600) % 12) / 12 * 360;
    hourEl.style.transform = `rotate(${hourDeg}deg)`;
    minuteEl.style.transform = `rotate(${minuteDeg}deg)`;
    secondGroupEl.style.transform = `rotate(${secondDeg}deg)`;
  }

  const swHourHand = document.getElementById('swHourHand');
  const swMinuteHand = document.getElementById('swMinuteHand');
  const swSecondGroup = document.getElementById('swSecondGroup');
  const timerHourHand = document.getElementById('timerHourHand');
  const timerMinuteHand = document.getElementById('timerMinuteHand');
  const timerSecondGroup = document.getElementById('timerSecondGroup');

  /* ---------- 공통 시간 포맷 ---------- */
  function formatTime(ms) {
    const totalMs = Math.max(0, Math.floor(ms));
    const hours = Math.floor(totalMs / 3600000);
    const minutes = Math.floor((totalMs % 3600000) / 60000);
    const seconds = Math.floor((totalMs % 60000) / 1000);
    const centis = Math.floor((totalMs % 1000) / 10);
    const pad = (n, len = 2) => String(n).padStart(len, '0');
    return {
      main: `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`,
      ms: `.${pad(centis)}`
    };
  }

  /* ---------- 스톱워치 ---------- */
  let swStart = 0;
  let swElapsed = 0;
  let swFrame = null;
  let swRunning = false;
  let laps = [];

  const timeEl = document.getElementById('time');
  const msEl = document.getElementById('ms');
  const startStopBtn = document.getElementById('startStopBtn');
  const lapBtn = document.getElementById('lapBtn');
  const resetBtn = document.getElementById('resetBtn');
  const lapsEl = document.getElementById('laps');

  function swRender() {
    const now = swRunning ? swElapsed + (performance.now() - swStart) : swElapsed;
    const { main, ms } = formatTime(now);
    timeEl.textContent = main;
    msEl.textContent = ms;
    updateWatchHands(swHourHand, swMinuteHand, swSecondGroup, now);
  }

  function swTick() {
    swRender();
    swFrame = requestAnimationFrame(swTick);
  }

  function swStartFn() {
    swRunning = true;
    swStart = performance.now();
    swFrame = requestAnimationFrame(swTick);
    startStopBtn.textContent = '정지';
    startStopBtn.classList.add('running');
    lapBtn.disabled = false;
    resetBtn.disabled = false;
  }

  function swStop() {
    swRunning = false;
    swElapsed += performance.now() - swStart;
    cancelAnimationFrame(swFrame);
    swRender();
    startStopBtn.textContent = '시작';
    startStopBtn.classList.remove('running');
  }

  function swReset() {
    swRunning = false;
    cancelAnimationFrame(swFrame);
    swElapsed = 0;
    laps = [];
    swRender();
    renderLaps();
    startStopBtn.textContent = '시작';
    startStopBtn.classList.remove('running');
    lapBtn.disabled = true;
    resetBtn.disabled = true;
  }

  function addLap() {
    const current = swRunning ? swElapsed + (performance.now() - swStart) : swElapsed;
    const prev = laps.length ? laps[laps.length - 1].total : 0;
    laps.push({ total: current, split: current - prev });
    renderLaps();
  }

  function renderLaps() {
    lapsEl.innerHTML = '';
    if (laps.length === 0) return;

    const splits = laps.map(l => l.split);
    const fastest = Math.min(...splits);
    const slowest = Math.max(...splits);
    const hasVariance = laps.length > 1 && fastest !== slowest;

    laps.forEach((lap, i) => {
      const item = document.createElement('div');
      item.className = 'lap-item';
      if (hasVariance && lap.split === fastest) item.classList.add('fastest');
      if (hasVariance && lap.split === slowest) item.classList.add('slowest');

      const splitFmt = formatTime(lap.split);
      const totalFmt = formatTime(lap.total);

      item.innerHTML = `
        <span class="lap-badge">${i + 1}</span>
        <span class="lap-info">
          <span class="lap-time">${splitFmt.main}${splitFmt.ms}</span>
          <span class="lap-total">${totalFmt.main}${totalFmt.ms}</span>
        </span>
      `;
      lapsEl.insertBefore(item, lapsEl.firstChild);
    });
  }

  startStopBtn.addEventListener('click', () => {
    swRunning ? swStop() : swStartFn();
  });
  lapBtn.addEventListener('click', addLap);
  resetBtn.addEventListener('click', swReset);

  /* ---------- 타이머 ---------- */
  const hoursInput = document.getElementById('hoursInput');
  const minutesInput = document.getElementById('minutesInput');
  const secondsInput = document.getElementById('secondsInput');
  const timerInputRow = document.getElementById('timerInputRow');
  const timerTime = document.getElementById('timerTime');
  const timerDisplayWrap = document.getElementById('timerDisplayWrap');
  const timerStartStopBtn = document.getElementById('timerStartStopBtn');
  const timerResetBtn = document.getElementById('timerResetBtn');
  const presetBtns = document.querySelectorAll('.preset-btn');

  let timerDurationMs = 0;
  let timerRemainingMs = 0;
  let timerDeadline = 0;
  let timerFrame = null;
  let timerRunning = false;
  let timerFinished = false;

  function getInputDurationMs() {
    const h = Math.max(0, parseInt(hoursInput.value, 10) || 0);
    const m = Math.max(0, parseInt(minutesInput.value, 10) || 0);
    const s = Math.max(0, parseInt(secondsInput.value, 10) || 0);
    return (h * 3600 + m * 60 + s) * 1000;
  }

  function timerRender() {
    const { main } = formatTime(timerRemainingMs);
    timerTime.textContent = main;
    updateWatchHands(timerHourHand, timerMinuteHand, timerSecondGroup, timerRemainingMs);
  }

  function timerTick() {
    timerRemainingMs = Math.max(0, timerDeadline - performance.now());
    timerRender();
    if (timerRemainingMs <= 0) {
      timerComplete();
      return;
    }
    timerFrame = requestAnimationFrame(timerTick);
  }

  function playBeep() {
    if (!soundEnabled) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.35, 0.7].forEach(delay => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.value = 0.2;
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + 0.25);
      });
    } catch (e) { /* 오디오 사용 불가 시 무시 */ }
  }

  function timerComplete() {
    timerRunning = false;
    timerFinished = true;
    cancelAnimationFrame(timerFrame);
    timerRemainingMs = 0;
    timerRender();
    timerDisplayWrap.classList.add('alert');
    document.getElementById('timerPanel').classList.add('alert');
    timerStartStopBtn.textContent = '시작';
    timerStartStopBtn.classList.remove('running');
    timerStartStopBtn.disabled = true;
    playBeep();
  }

  function timerStart() {
    if (timerFinished) return;
    if (!timerRunning && timerRemainingMs <= 0) {
      timerDurationMs = getInputDurationMs();
      if (timerDurationMs <= 0) return;
      timerRemainingMs = timerDurationMs;
    }
    timerRunning = true;
    timerDeadline = performance.now() + timerRemainingMs;
    timerFrame = requestAnimationFrame(timerTick);
    timerStartStopBtn.textContent = '일시정지';
    timerStartStopBtn.classList.add('running');
    timerResetBtn.disabled = false;
    timerInputRow.style.pointerEvents = 'none';
    timerInputRow.style.opacity = '0.5';
  }

  function timerPause() {
    timerRunning = false;
    timerRemainingMs = Math.max(0, timerDeadline - performance.now());
    cancelAnimationFrame(timerFrame);
    timerStartStopBtn.textContent = '재개';
    timerStartStopBtn.classList.remove('running');
  }

  function timerReset() {
    timerRunning = false;
    timerFinished = false;
    cancelAnimationFrame(timerFrame);
    timerRemainingMs = 0;
    timerDurationMs = 0;
    timerDisplayWrap.classList.remove('alert');
    document.getElementById('timerPanel').classList.remove('alert');
    timerRender();
    timerStartStopBtn.textContent = '시작';
    timerStartStopBtn.classList.remove('running');
    timerStartStopBtn.disabled = false;
    timerResetBtn.disabled = true;
    timerInputRow.style.pointerEvents = 'auto';
    timerInputRow.style.opacity = '1';
  }

  timerStartStopBtn.addEventListener('click', () => {
    timerRunning ? timerPause() : timerStart();
  });
  timerResetBtn.addEventListener('click', timerReset);

  presetBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      if (timerRunning) return;
      const secs = parseInt(btn.dataset.secs, 10);
      hoursInput.value = Math.floor(secs / 3600);
      minutesInput.value = Math.floor((secs % 3600) / 60);
      secondsInput.value = secs % 60;
      timerReset();
    });
  });

  [hoursInput, minutesInput, secondsInput].forEach(input => {
    input.addEventListener('input', () => {
      if (!timerRunning) timerReset();
    });
  });

  /* ---------- 키보드 단축키 (활성 탭 기준) ---------- */
  document.addEventListener('keydown', (e) => {
    const tag = document.activeElement.tagName;
    if (tag === 'INPUT') return;

    const stopwatchActive = document.getElementById('stopwatchPanel').classList.contains('active');

    if (e.code === 'Space') {
      e.preventDefault();
      if (stopwatchActive) {
        startStopBtn.click();
      } else if (!timerStartStopBtn.disabled) {
        timerStartStopBtn.click();
      }
    } else if (e.code === 'KeyL' && stopwatchActive && !lapBtn.disabled) {
      addLap();
    } else if (e.code === 'KeyR') {
      if (stopwatchActive && !resetBtn.disabled) swReset();
      else if (!stopwatchActive && !timerResetBtn.disabled) timerReset();
    }
  });

  swRender();
  timerRender();
</script>

</body>
</html>
